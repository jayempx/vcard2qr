# Build a downloadable artifact on request; do not publish releases automatically.
name: Windows portable build
on: workflow_dispatch
permissions:
  contents: read
jobs:
  package:
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m pip install -r requirements-dev.lock
      - run: python -m pip install --no-deps .
      - run: python -m pytest -q
      - name: Build Windows application
        shell: pwsh
        run: ./scripts/build_windows.ps1 -OutputDirectory "${{ runner.temp }}/portable"
      - name: Verify the packaged executable
        shell: pwsh
        run: |
          $process = Start-Process -FilePath "${{ runner.temp }}/portable/dist/vcard2qr/vcard2qr.exe" -ArgumentList @('--smoke-test', '"${{ runner.temp }}/package-smoke"') -WindowStyle Hidden -PassThru
          if (-not $process.WaitForExit(45000)) { throw 'Packaged smoke test timed out' }
          if ($process.ExitCode -ne 0) { throw "Packaged smoke test failed: $($process.ExitCode)" }
          $result = Get-Content "${{ runner.temp }}/package-smoke/result.json" | ConvertFrom-Json
          if (-not $result.passed) { throw 'Packaged smoke result was not successful' }
          if (-not $result.clipboard_available) { throw 'Offscreen clipboard verification failed' }
      - uses: actions/upload-artifact@v4
        with:
          name: vcard2qr-windows-x64
          path: ${{ runner.temp }}/portable/dist/vcard2qr
