# Validate both supported Windows Python baselines on every code change.
name: Checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    strategy:
      matrix:
        python: ['3.12', '3.14']
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install reproducible test dependencies
        run: python -m pip install -r requirements-dev.lock
      - name: Install the project
        run: python -m pip install --no-deps .
      - name: Lint and format
        run: |
          python -m ruff check .
          python -m ruff format --check .
      - name: Regression and QR decode tests
        run: python -m pytest -q
      - name: Build source and wheel distributions
        run: python -m build --outdir "${{ runner.temp }}/packages"
