# Build a small, installable desktop package with an explicit runtime baseline.
[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "vcard2qr"
version = "2.0.0"
description = "Private, local vCard QR creation and Excel batch export"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "PySide6-Essentials==6.12.0",
  "qrcode==8.2",
  "Pillow==13.0.0",
  "openpyxl==3.1.5",
]

# Essentials provides QtWidgets without shipping unused WebEngine and multimedia.
[project.gui-scripts]
vcard2qr = "vcard2qr.app:main"

[project.optional-dependencies]
dev = ["pytest==9.1.1", "ruff==0.17.2", "zxing-cpp==3.1.1", "build==1.6.1"]
package = ["pyinstaller==6.22.3"]

[tool.setuptools.packages.find]
include = ["vcard2qr*"]

# Keep checks useful and formatting consistent without excessive rules.
[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
